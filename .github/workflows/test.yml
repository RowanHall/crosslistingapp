name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  jest:
    name: Unit + integration (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx jest --ci --testPathIgnorePatterns="/node_modules/" "/__tests__/helpers/" "/__tests__/__fixtures__/" "/e2e/"

  playwright:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # E2E_AUTHED is unset by default — the specs that need a real auth session
          # auto-skip until a test user is provisioned. Once you set up local Supabase
          # in CI, set E2E_AUTHED=1 and supply E2E_LISTING_ID + E2E_PRELISTED_GRAILED_ID.
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
