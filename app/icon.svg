<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="mblur" x="-30%" y="-10%" width="180%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5 0.15"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm">
      <rect width="32" height="32" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="32" height="32" rx="6" ry="6" fill="#2D6A4F"/>

  <!-- Blurred trail layer -->
  <text x="16" y="16" fill="#EDE7DB"
    font-family="Impact,'Arial Narrow',sans-serif"
    font-weight="900" font-size="28" text-anchor="middle"
    dominant-baseline="central" letter-spacing="-1"
    filter="url(#mblur)" opacity="0.55">CL</text>

  <!-- Sharp letter with right-fade mask -->
  <text x="16" y="16" fill="#EDE7DB"
    font-family="Impact,'Arial Narrow',sans-serif"
    font-weight="900" font-size="28" text-anchor="middle"
    dominant-baseline="central" letter-spacing="-1"
    mask="url(#fm)">CL</text>
</svg>
